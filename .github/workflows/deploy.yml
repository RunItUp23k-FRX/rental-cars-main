name: Laravel Inertia SSR CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false  # Don't delete .env

      - name: Setup .env if missing
        run: |
          if [ ! -f .env ]; then
            echo ".env file missing, please create it manually on server"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets and SSR
        run: pnpm run build:ssr

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Laravel optimizations
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Set permissions
        run: |
          sudo chown -R www-data:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache

      - name: Restart PM2 SSR
        run: |
          if pm2 describe aguinane-ssr > /dev/null 2>&1; then
            pm2 restart aguinane-ssr
          else
            pm2 start bootstrap/ssr/ssr.js --name="aguinane-ssr"
            pm2 save
          fi

      - name: Reload PHP-FPM
        run: sudo systemctl reload php8.3-fpm